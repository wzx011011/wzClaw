name: Legacy Desktop CI

on:
  workflow_dispatch:
  push:
    paths:
      - "wzxClaw_desktop/**"
  pull_request:
    paths:
      - "wzxClaw_desktop/**"

jobs:
  legacy-desktop-test:
    name: Legacy Desktop Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wzxClaw_desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: wzxClaw_desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Legacy Desktop tests
        run: npm test
        env:
          CI: true

  legacy-desktop-e2e:
    name: Legacy Desktop E2E Session Sync
    runs-on: ubuntu-latest
    needs: legacy-desktop-test
    defaults:
      run:
        working-directory: wzxClaw_desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: wzxClaw_desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Legacy E2E session sync suite
        run: npm run test:e2e:session
        env:
          CI: true

  legacy-desktop-build-check:
    name: Legacy Desktop Build Check
    runs-on: ubuntu-latest
    needs: [legacy-desktop-test, legacy-desktop-e2e]
    defaults:
      run:
        working-directory: wzxClaw_desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: wzxClaw_desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Legacy Desktop
        run: npx electron-vite build
        env:
          CI: true
