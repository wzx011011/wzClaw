name: Product Release

on:
  push:
    tags:
      - "android-v*"
      - "companion-v*"

concurrency:
  group: product-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release-candidate:
    name: Android Release Candidate (validated artifact only)
    if: startsWith(github.ref_name, 'android-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: wzxClaw_android

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Verify tag matches pubspec version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#android-v}"
          app_version="$(perl -ne 'print $1 if /^version:\s*([^+\s]+)/' pubspec.yaml)"
          test -n "$app_version"
          test "$tag_version" = "$app_version" || {
            printf 'Tag version %s does not match pubspec version %s\n' "$tag_version" "$app_version" >&2
            exit 1
          }
          printf 'VERSION=%s\n' "$app_version" >> "$GITHUB_ENV"

      - name: Clean and get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build release-mode APK
        run: flutter build apk --release

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="build/app/outputs/flutter-apk/app-release.apk"
          output_apk="build/app/outputs/flutter-apk/wzxClaw-android-release-v${VERSION}.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -n "$apksigner" || { printf 'apksigner not found\n' >&2; exit 1; }
          "$apksigner" verify --verbose "$source_apk"
          unzip -t "$source_apk"
          cp "$source_apk" "$output_apk"
          sha256sum "$output_apk" > "${output_apk}.sha256"

      # 当前工程使用 debug signing，且 runner 未配置 NAS 凭据；这里只上传受控候选产物，
      # 不创建 GitHub Release，也不冒充已完成 NAS 正式发布。
      - name: Upload validated candidate
        uses: actions/upload-artifact@v4
        with:
          name: wzxClaw-android-release-v${{ env.VERSION }}-candidate
          path: |
            wzxClaw_android/build/app/outputs/flutter-apk/wzxClaw-android-release-v${{ env.VERSION }}.apk
            wzxClaw_android/build/app/outputs/flutter-apk/wzxClaw-android-release-v${{ env.VERSION }}.apk.sha256
          if-no-files-found: error
          retention-days: 14

  companion-release:
    name: Companion Release (Windows)
    if: startsWith(github.ref_name, 'companion-v')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: companion_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: companion_app/package-lock.json

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#companion-v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version" || {
            printf 'Tag version %s does not match package version %s\n' "$tag_version" "$package_version" >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Run Companion tests
        run: npm test

      - name: Build Windows packages
        run: npm run dist

      - name: Verify packaged contents
        shell: bash
        run: COMPANION_ASAR='dist/win-unpacked/resources/app.asar' npm run test:package

      - name: Publish Companion release
        uses: softprops/action-gh-release@v2
        with:
          name: wzxClaw Companion ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: companion_app/dist/*.exe
          body: |
            Windows Companion node release.

            This CI package does not embed the private ZCode runtime. Install and sign in to
            the official ZCode desktop application on the target machine before using it.
