name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  relay-companion-test:
    name: Relay & Companion Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay/zcode

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: relay/zcode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run relay and companion tests
        run: npm test

  companion-windows-package:
    name: Companion Windows Package
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: companion_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Companion tests
        run: npm test

      - name: Build unpacked Windows package
        run: npm run dist:dir

      - name: Verify package contents
        shell: bash
        run: COMPANION_ASAR='dist/win-unpacked/resources/app.asar' npm run test:package

  desktop-test:
    name: Desktop Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wzxClaw_desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wzxClaw_desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test
        env:
          CI: true

  desktop-e2e-session:
    name: Desktop E2E Session Sync
    runs-on: ubuntu-latest
    needs: desktop-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wzxClaw_desktop/package-lock.json

      # 旧 relay 已迁为桌面端测试夹具（e2e-session/harness/old-relay/），
      # ws 依赖由 desktop node_modules 提供，无需单独安装 relay 依赖
      - name: Install desktop dependencies
        working-directory: wzxClaw_desktop
        run: npm ci --legacy-peer-deps

      - name: Run E2E session sync suite
        working-directory: wzxClaw_desktop
        run: npm run test:e2e:session
        env:
          CI: true

  desktop-build-check:
    name: Desktop Build Check
    runs-on: ubuntu-latest
    needs: [desktop-test, desktop-e2e-session]
    defaults:
      run:
        working-directory: wzxClaw_desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wzxClaw_desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (vite compile check)
        run: npx electron-vite build
        env:
          CI: true

  android-analyze-test:
    name: Android Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wzxClaw_android

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
