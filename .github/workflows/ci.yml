name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  relay-companion-test:
    name: Relay & Companion Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay/zcode

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: relay/zcode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run relay and companion tests
        run: npm test

  android-analyze-test:
    name: Android Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wzxClaw_android

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
