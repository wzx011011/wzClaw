<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
  <title>wzxClaw Companion</title>
  <style>
    :root {
      --bg: #101210; --bg2: #181b18; --bg3: #20241f;
      --border: #2c312b; --text: #e6e8e3; --muted: #8a9186;
      --accent: #2ea56f; --warn: #d9a53a; --error: #e05c5c;
    }
    * { box-sizing: border-box; margin: 0; user-select: none; }
    body {
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg); color: var(--text); font-size: 14px;
    }
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 18px; border-bottom: 1px solid var(--border);
    }
    header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
    header .dot.paired { background: var(--accent); }
    header .dot.waiting { background: var(--warn); }
    header .dot.bad { background: var(--error); }
    header h1 { font-size: 16px; font-weight: 600; flex: 1; }
    header .sub { color: var(--muted); font-size: 12px; }
    main { padding: 16px 18px; display: grid; grid-template-columns: 300px 1fr; gap: 16px; }
    .card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px;
    }
    .card h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
    #qrImg {
      width: 240px; height: 240px; background: #fff; border-radius: 8px;
      display: block; margin: 0 auto;
    }
    .qr-empty {
      width: 240px; height: 240px; margin: 0 auto; display: flex;
      align-items: center; justify-content: center; color: var(--muted);
      font-size: 12px; text-align: center;
    }
    #pairUrl {
      margin-top: 10px; font-family: Consolas, monospace; font-size: 11px;
      color: var(--muted); word-break: break-all; max-height: 46px;
      overflow: hidden; user-select: text;
    }
    .btn {
      background: var(--bg3); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 4px; }
    input[type=text] {
      width: 100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; font-size: 13px; outline: none;
    }
    input[type=text]:focus { border-color: var(--accent); }
    #logs {
      height: 180px; overflow-y: auto; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px;
      font-family: Consolas, monospace; font-size: 11px; color: var(--muted);
      padding: 8px; user-select: text; white-space: pre-wrap;
    }
    .hint { color: var(--muted); font-size: 11px; margin-top: 8px; line-height: 1.6; }
    #modeBtns { display: flex; gap: 6px; }
    #modeBtns .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    #cfgMsg { color: var(--error); font-size: 12px; margin-top: 8px; min-height: 16px; }
    #grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 0; }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>wzxClaw Companion <span class="sub" id="stateText">启动中…</span></h1>
    <div id="modeBtns">
      <button class="btn active" id="btnFull">完整形态</button>
      <button class="btn" id="btnPet">桌面宠物</button>
    </div>
  </header>
  <main>
    <div style="display:flex; flex-direction:column; gap:16px;">
      <div class="card">
        <h2>手机配对二维码</h2>
        <img id="qrImg" alt="配对二维码" />
        <div class="qr-empty" id="qrEmpty">正在获取配对码…</div>
        <div id="pairUrl"></div>
        <div class="row">
          <button class="btn" id="btnCopy">复制配对链接</button>
          <button class="btn" id="btnReconnect">重启连接</button>
        </div>
        <div class="hint">
          手机 App 扫码配对；重启 / 重连不换码。<br />
          二维码含配对凭据，勿截图外传。
        </div>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; gap:16px;">
      <div class="card">
        <h2>连接设置</h2>
        <label>Relay 地址（默认 NAS）</label>
        <input type="text" id="relayUrl" />
        <label>大脑工作目录（引擎运行时本地性）</label>
        <div class="row" style="margin-top:0;">
          <input type="text" id="cwd" style="flex:1;" />
          <button class="btn" id="btnBrowse">浏览…</button>
        </div>
        <div class="row">
          <label style="margin:0; display:flex; gap:6px; align-items:center; color: var(--text);">
            <input type="checkbox" id="autoStart" /> 开机自启
          </label>
          <span style="flex:1"></span>
          <button class="btn primary" id="btnSave">保存并重连</button>
        </div>
        <div id="cfgMsg"></div>
      </div>
      <div class="card" id="grid2">
        <h2>运行日志</h2>
        <div id="logs"></div>
      </div>
    </div>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
