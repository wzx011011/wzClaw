<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" />
  <title>pet</title>
  <style>
    * { margin: 0; box-sizing: border-box; user-select: none; }
    html, body { background: transparent; overflow: hidden; height: 100%; }
    #root {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end; gap: 6px;
    }
    /* 状态气泡 */
    #bubble {
      max-width: 200px; background: rgba(24, 27, 24, 0.92);
      color: #e6e8e3; border: 1px solid #2c312b; border-radius: 10px;
      padding: 5px 10px; font-size: 12px;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
    }
    /* 宠物本体：可拖拽；双击 = 回完整形态 */
    #pet {
      -webkit-app-region: drag;
      width: 120px; height: 110px; cursor: grab;
      position: relative;
      background: #20241f;
      border: 2px solid var(--status, #8a9186);
      border-radius: 46% 46% 42% 42% / 54% 54% 40% 40%;
      animation: bob 2.6s ease-in-out infinite;
      transition: border-color 0.4s;
    }
    #pet::before, #pet::after {
      content: ''; position: absolute; top: 38px;
      width: 16px; height: 22px; background: #e6e8e3;
      border-radius: 50%; animation: blink 4.2s infinite;
    }
    #pet::before { left: 28px; }
    #pet::after { right: 28px; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
    }
    /* 非拖拽小操作条 */
    #bar {
      -webkit-app-region: no-drag;
      display: flex; gap: 6px; margin-bottom: 4px;
    }
    #bar button {
      background: rgba(24, 27, 24, 0.92); color: #e6e8e3;
      border: 1px solid #2c312b; border-radius: 8px;
      padding: 3px 10px; font-size: 11px; cursor: pointer;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
    }
    #bar button:hover { border-color: #2ea56f; }
  </style>
</head>
<body>
  <div id="root">
    <div id="bubble">启动中…</div>
    <div id="pet" title="双击回到完整形态"></div>
    <div id="bar">
      <button id="btnFull">完整形态</button>
      <button id="btnMenu">菜单</button>
    </div>
  </div>
  <script>
    const stateColor = {
      paired: '#2ea56f',
      'app-server-started': '#2ea56f',
      'waiting-pairing': '#d9a53a',
      'app-server-dead': '#e05c5c',
      disconnected: '#8a9186',
    };
    const stateText = {
      paired: '已连接 NAS',
      'app-server-started': '干活中',
      'waiting-pairing': '等手机配对',
      'app-server-dead': '桥异常',
      disconnected: '离线',
    };
    let lastState = 'disconnected';
    function apply(state) {
      lastState = state;
      document.getElementById('pet').style.setProperty(
        '--status', stateColor[state] || '#8a9186');
      document.getElementById('bubble').textContent =
        stateText[state] || state;
    }
    window.api.getSnapshot().then((s) => apply(s.state));
    window.api.onEvent((ev) => {
      if (ev.type === 'state') apply(ev.payload.state);
    });
    document.getElementById('pet').addEventListener('dblclick', () => {
      window.api.switchMode('full');
    });
    document.getElementById('btnFull').addEventListener('click', () => {
      window.api.switchMode('full');
    });
    document.getElementById('btnMenu').addEventListener('click', (e) => {
      const r = e.target.getBoundingClientRect();
      window.api.petMenu(r.left, r.bottom + 4);
    });
  </script>
</body>
</html>
